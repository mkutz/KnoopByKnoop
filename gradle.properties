group=com.knoopbyknoop
version=SNAPSHOT
description=Knoop by Knoop
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

