schema: spec-driven

context: |
  Knoop by Knoop is a navigator and route planner for the knooppunt (node) networks
  for cycling and hiking in the Netherlands, Belgium and neighboring countries.
  Network data comes only from OpenStreetMap (ODbL); the official Routedatabank is off limits.
  Shared logic lives in the Kotlin Multiplatform core and must stay free of platform APIs.
  The apps must work offline once a region is downloaded; there is no app backend.
  Low battery use during navigation outweighs visual polish.
  Android and iOS are both first-class; a requirement applies to both unless it says otherwise.

# Project context (optional)
