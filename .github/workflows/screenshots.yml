name: Store screenshots

# Takes the store screenshots of both apps in every app language at a fixed moment, see
# `store-screenshots`, and uploads them with a contact sheet for review. Nothing is committed or
# pushed to a store: after the review, the screenshots are committed by hand, and the workflow
# Release store listing brings them to the stores.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  LOCALES: en-US de-DE fr-FR nl-NL

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :apps:android:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The moment of `store-screenshots` "A fixed moment", set by the script before the app
      # starts.
      - id: moment
        run: echo "epoch=$(sh .github/scripts/coming-saturday.sh)" >> "$GITHUB_OUTPUT"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # 1080 × 2400 at 420 dpi; the script narrows the screen to 1080 × 1920.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            adb install -r apps/android/build/outputs/apk/debug/*.apk &&
            sh .github/scripts/android-screenshots.sh "$RUNNER_TEMP/android" "${{ steps.moment.outputs.epoch }}" "$LOCALES"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/android
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 120

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - run: brew install xcodegen

      - run: xcodegen --spec apps/ios/project.yml

      - name: Create the simulator
        run: |
          runtime=$(xcrun simctl list runtimes available | grep -m1 '^iOS' \
            | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+')
          device=$(xcrun simctl create "Screenshots" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          echo "DEVICE=$device" >> "$GITHUB_ENV"

      # Before the clock moves, which can upset builds and signing.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project apps/ios/KnoopByKnoop.xcodeproj
          -scheme 'KnoopByKnoop Screenshots'
          -destination "platform=iOS Simulator,id=$DEVICE"
          -derivedDataPath "$RUNNER_TEMP/derived"
          CODE_SIGNING_ALLOWED=NO

      # The moment of `store-screenshots` "A fixed moment": the simulator follows the runner's
      # clock and time zone, and the runner is thrown away afterwards.
      - name: Set the clock
        run: |
          epoch=$(sh .github/scripts/coming-saturday.sh)
          sudo systemsetup -setusingnetworktime off
          sudo systemsetup -settimezone Europe/Amsterdam
          sudo date -u "$(date -u -r "$epoch" +%m%d%H%M%Y.%S)"
          date

      - name: Prepare the simulator
        run: |
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "$(date +%Y-%m-%dT12:00:00%z)" \
            --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode notSupported
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP"/derived/Build/Products/Debug-iphonesimulator/KnoopByKnoop.app
          xcrun simctl privacy "$DEVICE" grant location-always com.knoopbyknoop

      - name: Take the screenshots
        run: |
          for locale in $LOCALES; do
            TEST_RUNNER_SCREENSHOT_LANGUAGE=${locale%-*} xcodebuild test-without-building \
              -project apps/ios/KnoopByKnoop.xcodeproj \
              -scheme 'KnoopByKnoop Screenshots' \
              -destination "platform=iOS Simulator,id=$DEVICE" \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              -resultBundlePath "$RUNNER_TEMP/results/$locale.xcresult" \
              -only-testing:KnoopByKnoopScreenshots/StoreScreenshots/testScreenshots
            sh .github/scripts/ios-screenshots-from-results.sh \
              "$RUNNER_TEMP/results/$locale.xcresult" "$RUNNER_TEMP/ios/$locale"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: |
            ${{ runner.temp }}/ios
            ${{ runner.temp }}/results
          if-no-files-found: error

  sheet:
    name: Contact sheet
    needs: [android, ios]
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/in

      # The fastlane layout of the store listing, see `store-listing`.
      - name: Collect
        run: |
          out="$RUNNER_TEMP/out"
          for locale in $LOCALES; do
            mkdir -p "$out/fastlane/metadata/android/$locale/images/phoneScreenshots" \
              "$out/fastlane/screenshots/ios/$locale"
            cp "$RUNNER_TEMP/in/android-screenshots/$locale/images/phoneScreenshots/"*.png \
              "$out/fastlane/metadata/android/$locale/images/phoneScreenshots/"
            cp "$RUNNER_TEMP/in/ios-screenshots/ios/$locale/"*.png \
              "$out/fastlane/screenshots/ios/$locale/"
          done

      - run: sudo apt-get install --yes imagemagick

      - run: sh .github/scripts/contact-sheet.sh "$RUNNER_TEMP/out/fastlane" "$RUNNER_TEMP/out/contact-sheet.png"

      - uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
