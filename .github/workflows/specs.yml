name: Specs

# Every push and pull request, also those changing only Markdown, which Build skips, see `spec-checks`
# "Specs checked on every push".
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  specs:
    name: Specs valid and scenarios tested
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The OpenSpec version the specs are written with; raise it together with the local one.
      - run: npx --yes @fission-ai/openspec@1.17.0 validate --all --no-interactive

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :tools:scenario-check:checkScenarios
