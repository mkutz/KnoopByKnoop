name: Release

# Delivers both apps to the stores' test tracks, see `release-delivery`. Promoting a build to
# production is done by hand in the store consoles.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0, with a section in CHANGELOG.md
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Green main and release notes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    outputs:
      release-notes: ${{ steps.release-notes.outputs.release-notes }}
      android: ${{ steps.credentials.outputs.android }}
      ios: ${{ steps.credentials.outputs.ios }}

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 0.2.0, got: $VERSION"
            exit 1
          fi

      # A platform without its store credentials is skipped, see `release-delivery` "Platforms
      # without store credentials are skipped". Job conditions cannot read secrets, so this step
      # tells the platform jobs whether theirs are set, without printing them.
      - id: credentials
        name: Check store credentials
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Whether all the named variables are set; a notice names the missing ones.
          ready() {
            platform=$1; shift
            missing=""
            for name in "$@"; do
              eval "value=\${$name:-}"
              [ -n "$value" ] || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "::notice::Skipping $platform, its store credentials are not set:$missing"
              return 1
            fi
          }
          android=true
          ready Android ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON \
            || android=false
          ios=true
          ready iOS APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID APPLE_TEAM_ID || ios=false
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          if [ "$android" = false ] && [ "$ios" = false ]; then
            echo "::error::No platform can be released: neither store's credentials are set"
            exit 1
          fi

      - id: release-notes
        name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          notes=$(sh .github/scripts/release-notes.sh "$VERSION")
          {
            echo "release-notes<<RELEASE_NOTES"
            echo "$notes"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      # The latest finished Build on main must have passed, and later commits may only change
      # Markdown, which Build skips (e.g. adding the CHANGELOG.md section for this release).
      - name: Check main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only built from main, not $GITHUB_REF"
            exit 1
          fi
          read -r checked_sha conclusion <<EOF
          $(gh run list --workflow build.yml --branch main --event push --status completed \
            --limit 1 --json headSha,conclusion --jq '.[0] | "\(.headSha) \(.conclusion)"')
          EOF
          if [ "$conclusion" != "success" ]; then
            echo "::error::The latest Build on main ($checked_sha) did not pass: $conclusion"
            exit 1
          fi
          unchecked=$(git diff --name-only "$checked_sha" "$GITHUB_SHA" | grep -v '\.md$' || true)
          if [ -n "$unchecked" ]; then
            echo "::error::Build has not passed yet for the latest changes to: $unchecked"
            exit 1
          fi

  android:
    needs: check
    if: needs.check.outputs.android == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ inputs.version }}
      build-number: ${{ github.run_number }}
      release-notes: ${{ needs.check.outputs.release-notes }}
    secrets: inherit

  ios:
    needs: check
    if: needs.check.outputs.ios == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ inputs.version }}
      build-number: ${{ github.run_number }}
      release-notes: ${{ needs.check.outputs.release-notes }}
    secrets: inherit
