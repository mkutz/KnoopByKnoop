name: Update Network Data

on:
  schedule:
    # Mondays, after Geofabrik's nightly extracts are ready
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-data
  cancel-in-progress: false

jobs:
  build:
    name: Build cycling and hiking networks
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # The covered area. All extracts are read together, so connections across their borders are
      # complete. A failing download fails the job, and the last publication stays as it is.
      - name: Download extracts
        run: |
          for extract in europe/netherlands europe/belgium europe/germany/nordrhein-westfalen; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/$(basename "$extract").osm.pbf" \
              "https://download.geofabrik.de/$extract-latest.osm.pbf"
          done

      - name: Build graph files
        run: >
          ./gradlew :pipeline:run
          --args="build nl-be-nrw $GITHUB_WORKSPACE/network-data
          $RUNNER_TEMP/netherlands.osm.pbf
          $RUNNER_TEMP/belgium.osm.pbf
          $RUNNER_TEMP/nordrhein-westfalen.osm.pbf"

      - uses: actions/upload-artifact@v7
        with:
          name: network-data
          path: |
            network-data/*.graph
            network-data/*.geometry
          if-no-files-found: error

  # Runs only when the build succeeded, so a failed run keeps the last publication.
  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          name: network-data
          path: network-data

      - name: Check size budgets
        run: |
          check() {
            size=$(stat --format=%s "network-data/$1")
            echo "$1: $size bytes (budget: $2)"
            test "$size" -lt "$2"
          }
          check cycling.graph 5000000
          check cycling.geometry 10000000

      - name: Write index
        run: ./gradlew :pipeline:run --args="index $GITHUB_WORKSPACE/network-data"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view network-data > /dev/null 2>&1; then
            gh release create network-data --latest=false --title "Network data" \
              --notes "Knooppunt network graphs for the apps, rebuilt weekly. Data © OpenStreetMap contributors, ODbL 1.0."
          fi
          gh release upload network-data network-data/* --clobber
          # Only after a successful upload: remove files that are no longer published, e.g. the
          # per-region files from before the networks were merged.
          gh release view network-data --json assets --jq '.assets[].name' | while read -r asset; do
            if [ ! -e "network-data/$asset" ]; then
              gh release delete-asset network-data "$asset" --yes
            fi
          done
