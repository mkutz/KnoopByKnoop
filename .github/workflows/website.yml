name: Website

# Builds knoopbyknoop.com from the repository and publishes it with GitHub Pages, see
# `project-website` "Published from main". A failing check stops the run before the deploy, so the
# site online stays as it was.
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'fastlane/metadata/**'
      - 'fastlane/screenshots/**'
      - 'design/icon/**'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - '.github/workflows/website.yml'
  # New network data for the planner, see `web-planner` "Data updated with the weekly publication".
  workflow_run:
    workflows:
      - Update Network Data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    # After the data workflow only when it published, see `web-planner`.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # The latest publication, checked against its index by the site build and copied into its
      # own folder, see `web-planner` "Network data from the website".
      - name: Download the network data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download network-data --dir "$RUNNER_TEMP/network-data"

      - run: ./gradlew :website:test :website:site -PnetworkData="$RUNNER_TEMP/network-data"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build/site
          # The app link files in .well-known, see `route-sharing` "Open a route link in the app".
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - id: deployment
        uses: actions/deploy-pages@v5
