name: Release Android

# Called by release.yml, see `release-delivery`.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
      release-notes:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Google Play internal testing
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build app bundle
        env:
          KNOOPBYKNOOP_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          KNOOPBYKNOOP_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KNOOPBYKNOOP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KNOOPBYKNOOP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: >
          ./gradlew :apps:android:bundleRelease
          -PversionName="$VERSION"
          -PversionCode="$BUILD_NUMBER"

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # The only native code is MapLibre's, shipped stripped. Its release publishes the symbols,
      # the Vulkan variant matches the default `android-sdk` artifact. Reduced to the symbol
      # table, like `debugSymbolLevel = "SYMBOL_TABLE"`, so Play can symbolicate native crashes.
      # From the public release URL, without a token. The version is matched with its quote, as the
      # library entry `maplibre-android = { module = ... }` starts the same way.
      - name: Collect native debug symbols
        run: |
          maplibre=$(grep '^maplibre-android = "' gradle/libs.versions.toml | cut -d '"' -f 2)
          release="https://github.com/maplibre/maplibre-native/releases/download/android-v$maplibre"
          mkdir -p "$RUNNER_TEMP/symbols"
          curl --fail --location --silent --show-error \
            "$release/debug-symbols-maplibre-android-vulkan-release-android-v$maplibre.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/symbols"
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find "$RUNNER_TEMP/symbols" -name '*.so' -exec "$strip" --strip-debug {} +
          (cd "$RUNNER_TEMP/symbols" && zip -r "$RUNNER_TEMP/native-debug-symbols.zip" .)

      # Kept, e.g. to install a release build without going through Play.
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ inputs.version }}-${{ inputs.build-number }}
          path: apps/android/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.knoopbyknoop
          releaseFiles: apps/android/build/outputs/bundle/release/*.aab
          debugSymbols: ${{ runner.temp }}/native-debug-symbols.zip
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
