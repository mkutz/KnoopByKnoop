name: Release iOS

# Called by release.yml, see `release-delivery`.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
      release-notes:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: TestFlight
    runs-on: macos-latest
    # Includes waiting for TestFlight to process the build.
    timeout-minutes: 90

    env:
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      ARCHIVE_PATH: ${{ runner.temp }}/KnoopByKnoop.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/export

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - run: brew install xcodegen fastlane

      - run: xcodegen --spec apps/ios/project.yml

      # Automatic signing with the App Store Connect API key: Apple manages the distribution
      # certificate and the profiles for the app and the widget extension.
      - name: Set up signing
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' "$API_KEY" > "$API_KEY_PATH"
          echo "DEVELOPMENT_TEAM = $TEAM_ID" > apps/ios/Signing.local.xcconfig
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :destination string export" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $TEAM_ID" \
            "$RUNNER_TEMP/ExportOptions.plist"

      # Build settings on the command line apply to both targets.
      - name: Archive
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: >
          xcodebuild archive
          -project apps/ios/KnoopByKnoop.xcodeproj
          -scheme KnoopByKnoop
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$ARCHIVE_PATH"
          -allowProvisioningUpdates
          -authenticationKeyPath "$API_KEY_PATH"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"
          MARKETING_VERSION="$VERSION"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export
        run: >
          xcodebuild -exportArchive
          -archivePath "$ARCHIVE_PATH"
          -exportPath "$EXPORT_PATH"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -allowProvisioningUpdates
          -authenticationKeyPath "$API_KEY_PATH"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"

      # `pilot` sets "What to Test", which `xcrun altool` cannot.
      - name: Upload to TestFlight
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          jq --null-input \
            --arg key_id "$API_KEY_ID" \
            --arg issuer_id "$API_ISSUER_ID" \
            --rawfile key "$API_KEY_PATH" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' > "$RUNNER_TEMP/api-key.json"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/api-key.json" \
            --ipa "$(ls "$EXPORT_PATH"/*.ipa)" \
            --changelog "$RELEASE_NOTES"

      - name: Remove keys
        if: always()
        run: rm -f "$API_KEY_PATH" "$RUNNER_TEMP/api-key.json"
