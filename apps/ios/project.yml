# XcodeGen spec. Generate the Xcode project with: xcodegen --spec apps/ios/project.yml
name: KnoopByKnoop

options:
  bundleIdPrefix: com.knoopbyknoop
  deploymentTarget:
    iOS: "17.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

targets:
  KnoopByKnoop:
    type: application
    platform: iOS
    sources:
      - KnoopByKnoop
      # The Live Activity's attributes and Stop intent, shared with the widget extension.
      - Shared
      # The dark map, generated by `:pipeline:darkStyle`, see `map-planning` "Light and dark
      # appearance".
      - path: ../../map-styles/liberty-dark.json
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - target: KnoopByKnoopWidgets
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # Merged with the generated Info.plist. The launch screen shows the round app icon, like
    # Android's splash screen, instead of a white screen (see design/icon/generate.py).
    info:
      path: KnoopByKnoop/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: LaunchLogo
        # Navigation keeps running and speaking with the screen locked, see `knot-navigation` and
        # openspec/changes/add-knot-navigation/spike.md: `audio` is needed to speak while locked.
        UIBackgroundModes: [location, audio]
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knoopbyknoop
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Knoop by Knoop
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Knoop by Knoop uses your position to show where you are on the map and, while navigating, to tell you the number to follow at the next knot.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Kotlin core framework, built by the pre-build script below.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../modules/core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework KnoopByKnoopCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The core is only built for Apple silicon simulators (iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      - name: Build Kotlin core
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/build-core.sh"'

  # The Live Activity while navigating, on the lock screen and in the Dynamic Island. It shows the
  # strings the app passes and does not link the core.
  KnoopByKnoopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KnoopByKnoopWidgets
      - Shared
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: KnoopByKnoopWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knoopbyknoop.widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Knoop by Knoop

# Defined here, so they survive regenerating the project; schemes edited in Xcode do not.
schemes:
  KnoopByKnoop:
    build:
      targets:
        KnoopByKnoop: all
    run:
      config: Debug
    archive:
      config: Release
  # For measuring startup times (`faster-startup`): a release build without the debugger, which
  # Xcode installs and then waits for the app to be started from the home screen.
  KnoopByKnoop Startup:
    build:
      targets:
        KnoopByKnoop: all
    run:
      config: Release
      debugEnabled: false
      askForAppToLaunch: true
